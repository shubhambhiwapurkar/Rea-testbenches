; SUMMIT engine configuration.

[/Script/EngineSettings.GameMapsSettings]
; Built by Tools/setup/setup_project.ps1 (SummitSetup commandlet) from the Tools/terrain output.
GameDefaultMap=/Game/Maps/L_Everest.L_Everest
EditorStartupMap=/Game/Maps/L_Everest.L_Everest
TransitionMap=
GlobalDefaultGameMode=/Script/Summit.SummitGameMode
+GameModeClassAliases=(Name="Summit",GameMode="/Script/Summit.SummitGameMode")

[/Script/Engine.RendererSettings]
; Lumen for GI and reflections: mountain lighting is dominated by sky and snow bounce (albedo ~0.8), which
; static lightmaps cannot handle on landscapes tens of kilometres across with a moving sun.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
; Virtual Shadow Maps: needed for crisp shadows over kilometre-scale view distances with Nanite rock.
r.Shadow.Virtual.Enable=1
; Nanite for photogrammetry rock and serac meshes.
r.Nanite.ProjectEnabled=True
; Virtual texturing for runtime virtual textures blending landscape and snow decals.
r.VirtualTextures=True
r.VirtualTexturedLightmaps=False
r.SkinCache.CompileShaders=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
; Substrate (the layered material framework) is off by default: it is still evolving between 5.x releases
; and changes how every material compiles. Turn it on (r.Substrate=True) when authoring layered snow/ice
; materials needs it (e.g. a wet-ice clear coat over blue glacier ice); expect a full shader recompile.
r.Substrate=False
; Landscape: 16-bit heightmaps (.png 16-bit grayscale or .r16 raw from Tools/terrain) import natively through
; the Landscape tool. Keep landscape LOD streaming on for huge tiles.
r.Landscape.RenderNanite=1
r.CustomDepth=3

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.PhysicsSettings]
; Standard gravity, matching summit::sim::kGravity (9.80665 m/s^2).
DefaultGravityZ=-980.665
; No DefaultPhysicalMaterial override is needed: Summit surfaces use USummitPhysicalMaterial assets
; (Terrain, SnowDepthM, Roughness01) assigned per landscape layer / mesh. Plain physical materials fall back
; to the surface types below, which follow ESummitTerrainType order (SurfaceType1 = Trail ... 11 = GlacierIce).
+PhysicalSurfaces=(Type=SurfaceType1,Name="Trail")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Grass")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Scree")
+PhysicalSurfaces=(Type=SurfaceType4,Name="Boulder")
+PhysicalSurfaces=(Type=SurfaceType5,Name="Rock")
+PhysicalSurfaces=(Type=SurfaceType6,Name="WetRock")
+PhysicalSurfaces=(Type=SurfaceType7,Name="Verglas")
+PhysicalSurfaces=(Type=SurfaceType8,Name="HardSnow")
+PhysicalSurfaces=(Type=SurfaceType9,Name="SoftSnow")
+PhysicalSurfaces=(Type=SurfaceType10,Name="DeepSnow")
+PhysicalSurfaces=(Type=SurfaceType11,Name="GlacierIce")
bEnableEnhancedDeterminism=False
bSubstepping=False

